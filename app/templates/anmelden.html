<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notizmappe</title>
<link rel="stylesheet" href="/static/stil.css">
</head>
<body class="anmeldeseite">
<form id="anmelden" class="anmeldetafel" autocomplete="on">
  <h1>Notizmappe</h1>
  {% if art == "einrichten" %}
    <p class="hinweis">Erste Einrichtung: Lege das Admin-Konto an. Den Einrichtungscode
      findest du im Protokoll des Servers (<code>docker logs notizmappe</code>).</p>
    <label>Einrichtungscode <input name="code" required autocomplete="off" spellcheck="false"></label>
    <label>Name <input name="name" required autocomplete="username"></label>
    <label>Passwort <input name="passwort" type="password" required minlength="8" autocomplete="new-password"></label>
    <label>Passwort wiederholen <input name="wieder" type="password" required minlength="8" autocomplete="new-password"></label>
    <button type="submit">Konto anlegen</button>
  {% elif art == "sperre" %}
    <p class="hinweis">Gesperrt.</p>
    <label>Passwort <input name="passwort" type="password" required autofocus autocomplete="current-password"></label>
    <button type="submit">Entsperren</button>
  {% else %}
    <label>Name <input name="name" required autofocus autocomplete="username"></label>
    <label>Passwort <input name="passwort" type="password" required autocomplete="current-password"></label>
    <button type="submit">Anmelden</button>
  {% endif %}
  <p id="fehler" class="fehler" hidden></p>
  <p class="fuss">v{{ version }}</p>
</form>
<script>
(function () {
  var art = {{ art | tojson }};
  var form = document.getElementById('anmelden');
  var fehler = document.getElementById('fehler');
  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var d = {};
    new FormData(form).forEach(function (w, k) { d[k] = w; });
    if (art === 'einrichten' && d.passwort !== d.wieder) {
      fehler.textContent = 'Die beiden Passwörter sind nicht gleich.';
      fehler.hidden = false;
      return;
    }
    var knopf = form.querySelector('button');
    knopf.disabled = true;
    fetch(art === 'einrichten' ? '/api/einrichten' : '/api/anmelden', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(d),
    }).then(function (a) {
      return a.json().catch(function () { return {}; }).then(function (j) {
        if (a.ok) { location.replace('/'); return; }
        fehler.textContent = j.fehler || j.detail || ('Fehler ' + a.status);
        fehler.hidden = false;
        knopf.disabled = false;
        var pw = form.querySelector('input[name=passwort]');
        if (pw) { pw.value = ''; pw.focus(); }
      });
    }).catch(function (f) {
      fehler.textContent = 'Keine Verbindung: ' + f.message;
      fehler.hidden = false;
      knopf.disabled = false;
    });
  });
})();
</script>
</body>
</html>
