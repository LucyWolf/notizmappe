# ===== Installer-Einstellungen - die einzige Datei, die man anfassen muss =====
# Bei jedem Release baut .github/workflows/installer.yml daraus und haengt ans Release:
#   - Linux:   drei Doppelklick-Installer (.desktop) und das Installationsskript
#   - Windows: ein setup.exe
# Ohne "#" davor = an, mit "#" davor = aus.

APP_NAME="Notizmappe"
APP_ID="notizmappe"
APP_COMMENT="Freie Notizflaeche, Daten im eigenen Nextcloud-/NAS-Ordner"

# Version kommt aus dem Release-Tag (v1.1.0 -> 1.1.0) - app/VERSION ist die Quelle.
#VERSION="1.0.0"

# --- Linux ---
# Die Datei aus dem Release, die installiert wird. Darin steckt alles: Programm,
# Einrichtung und die Python-Pakete. Der Name bleibt ohne Versionsnummer, damit
# releases/latest/download immer passt.
LINUX_FILE="notizmappe-installer.sh"
# --starten: einrichten falls noch nicht da, dann das Fenster oeffnen. Derselbe
# Aufruf taugt fuer den ersten Start und fuer jeden spaeteren Menueklick.
LINUX_RUN="bash {file} --starten"
# Python, curl - und die Webansicht fuers Fenster. Die kommt als
# Distributionspaket (WebKit2GTK + PyGObject), per pip ist sie nicht zu haben.
PKGS_ARCH="python curl python-gobject webkit2gtk-4.1"
PKGS_DEB="python3 python3-venv curl python3-gi gir1.2-webkit2-4.1"
PKGS_RPM="python3 curl python3-gobject webkit2gtk4.1"
PKGS_SUSE="python3 curl python3-gobject typelib-1_0-WebKit2-4_1"
#ROOT_CMDS=""

# --- Windows ---
# Die .exe aus dem Release (PyInstaller-Buendel, bringt Python mit; das Fenster
# kommt von der Edge-WebView2, die auf Windows 10/11 vorhanden ist).
WINDOWS_FILE="Notizmappe.exe"

# --- Symbol ---  aus = Standardsymbol
#ICON_PNG="icon.png"
#ICON_ICO="icon.ico"
