# ===== Installer-Einstellungen - die einzige Datei, die man anfassen muss =====
# Bei jedem Release baut .github/workflows/installer.yml daraus und haengt ans Release:
#   - Linux:   drei Doppelklick-Installer (.desktop) und das Installationsskript
#   - Windows: ein setup.exe
# Ohne "#" davor = an, mit "#" davor = aus.

APP_NAME="Notizmappe"
APP_ID="notizmappe"
APP_COMMENT="Freie Notizflaeche, Daten im eigenen Nextcloud-/NAS-Ordner"

# Version kommt aus dem Release-Tag (v1.0.2 -> 1.0.2) - app/VERSION ist die Quelle.
#VERSION="1.0.0"

# --- Linux ---
# Die Datei aus dem Release, die installiert wird. Darin steckt alles: Programm,
# Einrichtung und die Python-Pakete. Der Name bleibt ohne Versionsnummer, damit
# releases/latest/download immer passt.
LINUX_FILE="notizmappe-installer.sh"
# --starten: einrichten falls noch nicht da, dann den Browser oeffnen. Derselbe
# Aufruf taugt fuer den ersten Start und fuer jeden spaeteren Menueklick.
LINUX_RUN="bash {file} --starten"
# Mehr als Python und curl braucht es nicht - alles andere steckt im Paket.
PKGS_ARCH="python curl"
PKGS_DEB="python3 python3-venv curl"
PKGS_RPM="python3 curl"
PKGS_SUSE="python3 curl"
#ROOT_CMDS=""

# --- Windows ---
# Die .exe aus dem Release (PyInstaller-Buendel, bringt Python mit).
WINDOWS_FILE="Notizmappe.exe"

# --- Symbol ---  aus = Standardsymbol
#ICON_PNG="icon.png"
#ICON_ICO="icon.ico"
