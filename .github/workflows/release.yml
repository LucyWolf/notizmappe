# Baut bei jedem Tag v* die beiden Programmdateien und haengt sie an ein Release:
#   notizmappe-v<version>-installer.sh   Linux, alles enthalten (auch die Python-Pakete)
#   notizmappe-installer.sh              dieselbe Datei unter festem Namen, damit
#                                        releases/latest/download fuer den
#                                        Doppelklick-Installer immer passt
#   Notizmappe.exe                       Windows, PyInstaller-Buendel mit Python drin
#
# Sobald das Release veroeffentlicht ist, uebernimmt installer.yml und macht daraus
# die Doppelklick-Dateien und setup.exe.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Die Versionsnummer steht in app/VERSION. Laeuft der Tag davon weg, sieht eine
      # laufende Installation nie wieder ein Update - also hier abbrechen.
      - name: Version gegen den Tag pruefen
        run: |
          VER=$(tr -d ' \n' < app/VERSION)
          TAG="${GITHUB_REF_NAME#v}"
          echo "app/VERSION=$VER  Tag=$TAG"
          if [ "${{ github.event_name }}" = "push" ] && [ "$VER" != "$TAG" ]; then
            echo "::error::app/VERSION ($VER) passt nicht zum Tag ($TAG)."
            exit 1
          fi
          echo "VER=$VER" >> "$GITHUB_ENV"

      - name: Werkzeuge fuer die Pruefung
        run: pip install -r requirements.txt esprima httpx

      - name: Tests
        run: |
          python tests/test_api.py
          python tests/test_update.py

      - name: Paket bauen
        run: PY=python ./tools/paket_bauen.sh

      - name: Unter festem Namen danebenlegen
        run: cp "dist/notizmappe-v$VER-installer.sh" dist/notizmappe-installer.sh

      # Das gebaute Paket einmal wirklich durchspielen: auspacken, einrichten,
      # starten, aktualisieren, deinstallieren - in einem Wegwerf-Heim.
      - name: Installationsdatei durchspielen
        run: ./tests/test_installer.sh "dist/notizmappe-v$VER-installer.sh"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/notizmappe-v*-installer.sh
            dist/notizmappe-v*-installer.sh.sha256
            dist/notizmappe-installer.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten
        run: pip install -r requirements.txt pyinstaller

      # --paths app ist der Punkt: ohne das findet PyInstaller "import main" nicht,
      # packt app/ nur als Daten ein und sieht die Imports darin nie - dann fehlt
      # zur Laufzeit html.parser, weil es nur reinigen.py braucht.
      # --add-data bleibt trotzdem noetig, fuer templates, static und VERSION.
      # --collect-all: uvicorn und fastapi laden einen Teil ihrer Module erst zur
      # Laufzeit nach Namen, das sieht keine statische Analyse.
      - name: Buendeln
        run: >
          pyinstaller --onefile --name Notizmappe
          --paths app
          --add-data "app;app"
          --collect-all uvicorn --collect-all fastapi --collect-all starlette
          --collect-all jinja2 --collect-all pydantic --collect-all webview
          --noconsole
          windows/notizmappe_start.py

      # Die Ausgabe der exe in Dateien umleiten und hinterher zeigen - sonst
      # verschluckt Start-Process den Grund, warum sie nicht hochkommt.
      - name: Buendel wirklich starten
        shell: pwsh
        run: |
          $env:PORT = "8112"
          # Der Buildlauf hat keinen Desktop - also Server ohne Fenster pruefen.
          $env:NOTIZMAPPE_NUR_SERVER = "1"
          $p = Start-Process -FilePath dist\Notizmappe.exe -PassThru -NoNewWindow `
                 -RedirectStandardOutput out.txt -RedirectStandardError err.txt
          $ok = $false
          foreach ($i in 1..30) {
            Start-Sleep -Seconds 2
            if ($p.HasExited) { break }
            try { if ((Invoke-WebRequest "http://127.0.0.1:8112/" -UseBasicParsing).StatusCode -eq 200) { $ok = $true; break } } catch {}
          }
          Write-Host "--- Ausgabe der exe ---"
          if (Test-Path out.txt) { Get-Content out.txt }
          Write-Host "--- Fehlerausgabe ---"
          if (Test-Path err.txt) { Get-Content err.txt }
          Write-Host "-----------------------"
          if (-not $ok) {
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
            throw "Notizmappe.exe antwortet nicht auf 8112 (beendet: $($p.HasExited))"
          }
          $baum = Invoke-WebRequest "http://127.0.0.1:8112/api/baum" -UseBasicParsing
          if ($baum.Content -notmatch "notizbuecher") { throw "API antwortet nicht wie erwartet" }
          Stop-Process -Id $p.Id -Force
          Write-Host "Buendel läuft."

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/Notizmappe.exe

  release:
    needs: [linux, windows]
    # Nur bei einem Tag. So kann man den Bau per workflow_dispatch probieren, ohne
    # ein Release anzulegen und ohne eine Versionsnummer zu verbrennen.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: anhaenge
      - name: Release anlegen und anhaengen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Notizmappe ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            anhaenge/linux/*
            anhaenge/windows/*

  # Macht aus installer.conf die drei Linux-Doppelklick-Dateien und setup.exe und
  # haengt sie an dasselbe Release.
  doppelklick:
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/installer.yml
    with:
      tag: ${{ github.ref_name }}
    permissions:
      contents: write
