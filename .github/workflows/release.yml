# Baut bei jedem Tag v* die beiden Programmdateien und haengt sie an ein Release:
#   notizmappe-v<version>-installer.sh   Linux, alles enthalten (auch die Python-Pakete)
#   notizmappe-installer.sh              dieselbe Datei unter festem Namen, damit
#                                        releases/latest/download fuer den
#                                        Doppelklick-Installer immer passt
#   Notizmappe.exe                       Windows, PyInstaller-Buendel mit Python drin
#
# Sobald das Release veroeffentlicht ist, uebernimmt installer.yml und macht daraus
# die Doppelklick-Dateien und setup.exe.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Die Versionsnummer steht in app/VERSION. Laeuft der Tag davon weg, sieht eine
      # laufende Installation nie wieder ein Update - also hier abbrechen.
      - name: Version gegen den Tag pruefen
        run: |
          VER=$(tr -d ' \n' < app/VERSION)
          TAG="${GITHUB_REF_NAME#v}"
          echo "app/VERSION=$VER  Tag=$TAG"
          if [ "${{ github.event_name }}" = "push" ] && [ "$VER" != "$TAG" ]; then
            echo "::error::app/VERSION ($VER) passt nicht zum Tag ($TAG)."
            exit 1
          fi
          echo "VER=$VER" >> "$GITHUB_ENV"

      - name: Werkzeuge fuer die Pruefung
        run: pip install -r requirements.txt esprima httpx

      - name: Tests
        run: |
          python tests/test_api.py
          python tests/test_update.py

      - name: Paket bauen
        run: PY=python ./tools/paket_bauen.sh

      - name: Unter festem Namen danebenlegen
        run: cp "dist/notizmappe-v$VER-installer.sh" dist/notizmappe-installer.sh

      # Das gebaute Paket einmal wirklich durchspielen: auspacken, einrichten,
      # starten, aktualisieren, deinstallieren - in einem Wegwerf-Heim.
      - name: Installationsdatei durchspielen
        run: ./tests/test_installer.sh "dist/notizmappe-v$VER-installer.sh"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/notizmappe-v*-installer.sh
            dist/notizmappe-v*-installer.sh.sha256
            dist/notizmappe-installer.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten
        run: pip install -r requirements.txt pyinstaller

      # --paths app ist der Punkt: ohne das findet PyInstaller "import main" nicht,
      # packt app/ nur als Daten ein und sieht die Imports darin nie - dann fehlt
      # zur Laufzeit html.parser, weil es nur reinigen.py braucht.
      # --add-data bleibt trotzdem noetig, fuer templates, static und VERSION.
      # --collect-all: uvicorn und fastapi laden einen Teil ihrer Module erst zur
      # Laufzeit nach Namen, das sieht keine statische Analyse.
      - name: Buendeln
        run: >
          pyinstaller --onedir --name Notizmappe --icon icon.ico
          --paths app
          --add-data "app;app"
          --collect-all uvicorn --collect-all fastapi --collect-all starlette
          --collect-all jinja2 --collect-all pydantic --collect-all webview
          --exclude-module tkinter --exclude-module unittest --exclude-module pydoc
          --exclude-module test --exclude-module lib2to3 --exclude-module pip
          --noconsole
          windows/notizmappe_start.py

      # Die Ausgabe der exe in Dateien umleiten und hinterher zeigen - sonst
      # verschluckt Start-Process den Grund, warum sie nicht hochkommt.
      - name: Als ZIP packen
        shell: pwsh
        run: |
          $gesamt = (Get-ChildItem dist\Notizmappe -Recurse | Measure-Object -Property Length -Sum).Sum
          Write-Host "Programmordner: $([math]::Round($gesamt / 1MB, 1)) MB, $((Get-ChildItem dist\Notizmappe -Recurse -File).Count) Dateien"
          Compress-Archive -Path dist\Notizmappe\* -DestinationPath Notizmappe-windows.zip -CompressionLevel Optimal
          Write-Host "ZIP: $([math]::Round((Get-Item Notizmappe-windows.zip).Length / 1MB, 1)) MB"

      - name: Buendel wirklich starten
        shell: pwsh
        run: |
          $exe = "dist\Notizmappe\Notizmappe.exe"
          $uhr = [Diagnostics.Stopwatch]::StartNew()
          $env:PORT = "8112"
          # Der Buildlauf hat keinen Desktop - also Server ohne Fenster pruefen.
          $env:NOTIZMAPPE_NUR_SERVER = "1"
          $p = Start-Process -FilePath $exe -PassThru -NoNewWindow `
                 -RedirectStandardOutput out.txt -RedirectStandardError err.txt
          $ok = $false
          foreach ($i in 1..30) {
            Start-Sleep -Seconds 2
            if ($p.HasExited) { break }
            try { if ((Invoke-WebRequest "http://127.0.0.1:8112/" -UseBasicParsing).StatusCode -eq 200) { $ok = $true; break } } catch {}
          }
          Write-Host "--- Ausgabe der exe ---"
          if (Test-Path out.txt) { Get-Content out.txt }
          Write-Host "--- Fehlerausgabe ---"
          if (Test-Path err.txt) { Get-Content err.txt }
          Write-Host "-----------------------"
          if (-not $ok) {
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
            throw "Notizmappe.exe antwortet nicht auf 8112 (beendet: $($p.HasExited))"
          }
          Write-Host "Bis zur ersten Antwort: $([math]::Round($uhr.Elapsed.TotalSeconds, 1)) s"
          # Aus einem Ordner gestartet gibt es keinen Auspacker mehr: genau einer.
          $wieviele = (Get-Process -Name Notizmappe -ErrorAction SilentlyContinue).Count
          Write-Host "Prozesse mit diesem Namen: $wieviele"
          if ($wieviele -gt 1) { throw "Es laufen $wieviele Prozesse - erwartet war einer" }
          $baum = Invoke-WebRequest "http://127.0.0.1:8112/api/baum" -UseBasicParsing
          if ($baum.Content -notmatch "notizbuecher") { throw "API antwortet nicht wie erwartet" }
          Stop-Process -Id $p.Id -Force
          Write-Host "Buendel läuft."

      # Bisher lief die exe im Buildlauf immer nur als Server - der Weg zum
      # Fenster wurde nie geprueft. Genau dort klemmt es aber: oeffnet sich keins,
      # beendet sich das Programm, und man sieht nichts.
      - name: Fenster wirklich oeffnen
        shell: pwsh
        run: |
          $env:PORT = "8115"
          Remove-Item Env:\NOTIZMAPPE_NUR_SERVER -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath dist\Notizmappe\Notizmappe.exe -PassThru `
                 -RedirectStandardOutput fenster-out.txt -RedirectStandardError fenster-err.txt
          Start-Sleep -Seconds 35
          $log = Join-Path $env:LOCALAPPDATA "notizmappe\fenster.log"
          Write-Host "--- fenster.log ---"
          if (Test-Path $log) { Get-Content $log } else { Write-Host "(kein Protokoll geschrieben)" }
          Write-Host "--- Ausgabe ---"; if (Test-Path fenster-out.txt) { Get-Content fenster-out.txt }
          Write-Host "--- Fehler ---";  if (Test-Path fenster-err.txt) { Get-Content fenster-err.txt }
          Write-Host "--- Prozesse ---"
          Get-Process -Name Notizmappe,msedge,chrome -ErrorAction SilentlyContinue |
            Select-Object Name,Id | Format-Table | Out-String | Write-Host
          $lebt = -not $p.HasExited
          Get-Process -Name Notizmappe,msedge -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $lebt) { throw "Das Programm hat sich beendet, statt ein Fenster offen zu halten" }
          Write-Host "Das Programm läuft mit Fenster."

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: Notizmappe-windows.zip

  release:
    needs: [linux, windows]
    # Nur bei einem Tag. So kann man den Bau per workflow_dispatch probieren, ohne
    # ein Release anzulegen und ohne eine Versionsnummer zu verbrennen.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: anhaenge
      - name: Release anlegen und anhaengen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Notizmappe ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            anhaenge/linux/*
            anhaenge/windows/*

  # Die fertige setup.exe einmal wirklich benutzen: installieren, starten, abfragen,
  # deinstallieren. Der Vorlagen-Workflow prueft nur, dass die Installation
  # durchlaeuft - ob danach etwas laeuft, sagt das nicht. Unter Linux war genau das
  # der Unterschied zwischen "installiert" und "tut was".
  windows_probe:
    needs: doppelklick
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    steps:
      - name: Setup aus dem Release holen
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          Invoke-WebRequest -UseBasicParsing -OutFile setup.exe `
            "https://github.com/${{ github.repository }}/releases/download/$tag/notizmappe-setup.exe"
          Write-Host "geladen: $((Get-Item setup.exe).Length) Bytes"

      - name: Stumm installieren
        shell: pwsh
        run: |
          $p = Start-Process .\setup.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Setup endete mit $($p.ExitCode)" }
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter "Notizmappe.exe" | Select-Object -First 1
          if (-not $exe) { throw "Notizmappe.exe nach der Installation nicht gefunden" }
          Write-Host "installiert: $($exe.FullName)"
          "EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Installierte Fassung starten und abfragen
        shell: pwsh
        run: |
          $env:PORT = "8113"
          $env:NOTIZMAPPE_NUR_SERVER = "1"    # auf dem Runner gibt es keinen Desktop
          $p = Start-Process -FilePath "$env:EXE" -PassThru -NoNewWindow `
                 -RedirectStandardOutput out.txt -RedirectStandardError err.txt
          $ok = $false
          foreach ($i in 1..30) {
            Start-Sleep -Seconds 2
            if ($p.HasExited) { break }
            try { if ((Invoke-WebRequest "http://127.0.0.1:8113/" -UseBasicParsing).StatusCode -eq 200) { $ok = $true; break } } catch {}
          }
          Write-Host "--- Ausgabe ---"; if (Test-Path out.txt) { Get-Content out.txt }
          Write-Host "--- Fehler ---";  if (Test-Path err.txt) { Get-Content err.txt }
          if (-not $ok) {
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
            throw "Die installierte Notizmappe antwortet nicht (beendet: $($p.HasExited))"
          }
          $v = (Invoke-WebRequest "http://127.0.0.1:8113/api/einstellungen" -UseBasicParsing).Content
          Write-Host "Einstellungen: $v"
          if ($v -notmatch "${{ github.ref_name }}".TrimStart("v")) { throw "Falsche Version in der Installation" }
          Stop-Process -Id $p.Id -Force
          Write-Host "Installierte Fassung läuft."

      # Der Fall aus dem echten Leben: es laeuft bereits eine Fassung, und man
      # installiert darueber. Genau daran ist das Setup gescheitert - die
      # Schliessen-Aufforderung erreicht einen Prozess ohne Fenster nicht.
      - name: Ueber eine laufende Fassung installieren
        shell: pwsh
        run: |
          $env:PORT = "8114"
          $env:NOTIZMAPPE_NUR_SERVER = "1"
          $laeuft = Start-Process -FilePath "$env:EXE" -PassThru -NoNewWindow `
                      -RedirectStandardOutput lauf.txt -RedirectStandardError lauf-err.txt
          foreach ($i in 1..20) {
            Start-Sleep -Seconds 2
            try { if ((Invoke-WebRequest "http://127.0.0.1:8114/" -UseBasicParsing).StatusCode -eq 200) { break } } catch {}
          }
          if ($laeuft.HasExited) { throw "Die laufende Fassung ist von selbst beendet" }
          Write-Host "laeuft als PID $($laeuft.Id), jetzt darueber installieren"

          $p = Start-Process .\setup.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -PassThru -Wait
          Write-Host "Setup-Rueckgabe: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "Setup ueber eine laufende Fassung endete mit $($p.ExitCode)" }
          if (-not (Test-Path "$env:EXE")) { throw "Nach dem Ueberinstallieren fehlt die exe" }
          Get-Process -Name "Notizmappe" -ErrorAction SilentlyContinue | Stop-Process -Force
          Write-Host "Ueberinstallieren hat funktioniert."

      - name: Wieder deinstallieren
        if: always()
        shell: pwsh
        run: |
          $u = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter "unins000.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($u) {
            $r = Start-Process $u.FullName -ArgumentList "/VERYSILENT" -PassThru -Wait
            Write-Host "deinstalliert, Rückgabe $($r.ExitCode)"
          }

  # Macht aus installer.conf die drei Linux-Doppelklick-Dateien und setup.exe und
  # haengt sie an dasselbe Release.
  doppelklick:
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/installer.yml
    with:
      tag: ${{ github.ref_name }}
    permissions:
      contents: write
