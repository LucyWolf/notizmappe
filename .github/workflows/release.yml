# Baut bei jedem Tag v* die beiden Programmdateien und haengt sie an ein Release:
#   notizmappe-v<version>-installer.sh   Linux, alles enthalten (auch die Python-Pakete)
#   notizmappe-installer.sh              dieselbe Datei unter festem Namen, damit
#                                        releases/latest/download fuer den
#                                        Doppelklick-Installer immer passt
#   Notizmappe.exe                       Windows, PyInstaller-Buendel mit Python drin
#
# Sobald das Release veroeffentlicht ist, uebernimmt installer.yml und macht daraus
# die Doppelklick-Dateien und setup.exe.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Die Versionsnummer steht in app/VERSION. Laeuft der Tag davon weg, sieht eine
      # laufende Installation nie wieder ein Update - also hier abbrechen.
      - name: Version gegen den Tag pruefen
        run: |
          VER=$(tr -d ' \n' < app/VERSION)
          TAG="${GITHUB_REF_NAME#v}"
          echo "app/VERSION=$VER  Tag=$TAG"
          if [ "${{ github.event_name }}" = "push" ] && [ "$VER" != "$TAG" ]; then
            echo "::error::app/VERSION ($VER) passt nicht zum Tag ($TAG)."
            exit 1
          fi
          echo "VER=$VER" >> "$GITHUB_ENV"

      - name: Werkzeuge fuer die Pruefung
        run: pip install -r requirements.txt esprima httpx

      - name: Tests
        run: |
          python tests/test_api.py
          python tests/test_update.py

      - name: Paket bauen
        run: PY=python ./tools/paket_bauen.sh

      - name: Unter festem Namen danebenlegen
        run: cp "dist/notizmappe-v$VER-installer.sh" dist/notizmappe-installer.sh

      # Das gebaute Paket einmal wirklich durchspielen: auspacken, einrichten,
      # starten, aktualisieren, deinstallieren - in einem Wegwerf-Heim.
      - name: Installationsdatei durchspielen
        run: ./tests/test_installer.sh "dist/notizmappe-v$VER-installer.sh"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/notizmappe-v*-installer.sh
            dist/notizmappe-v*-installer.sh.sha256
            dist/notizmappe-installer.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten
        run: pip install -r requirements.txt pyinstaller

      # --paths app: ohne das findet PyInstaller "import fenster" nicht, packt app/
      # nur als Daten ein und sieht die Imports darin nie - dann fehlt zur Laufzeit
      # html.parser, weil es nur reinigen.py braucht.
      # --add-data bleibt noetig, fuer die Oberflaeche und VERSION.
      # Seit es keinen Webserver mehr gibt, fallen fastapi, uvicorn, starlette,
      # jinja2 und pydantic ganz weg - das war der groesste Teil der Ladezeit.
      - name: Buendeln
        run: >
          pyinstaller --onedir --name Notizmappe --icon icon.ico
          --paths app
          --add-data "app;app"
          --collect-all webview
          --exclude-module tkinter --exclude-module unittest --exclude-module pydoc
          --exclude-module test --exclude-module lib2to3 --exclude-module pip
          --noconsole
          windows/notizmappe_start.py

      # Die Ausgabe der exe in Dateien umleiten und hinterher zeigen - sonst
      # verschluckt Start-Process den Grund, warum sie nicht hochkommt.
      - name: Als ZIP packen
        shell: pwsh
        run: |
          $gesamt = (Get-ChildItem dist\Notizmappe -Recurse | Measure-Object -Property Length -Sum).Sum
          Write-Host "Programmordner: $([math]::Round($gesamt / 1MB, 1)) MB, $((Get-ChildItem dist\Notizmappe -Recurse -File).Count) Dateien"
          Compress-Archive -Path dist\Notizmappe\* -DestinationPath Notizmappe-windows.zip -CompressionLevel Optimal
          Write-Host "ZIP: $([math]::Round((Get-Item Notizmappe-windows.zip).Length / 1MB, 1)) MB"

      - name: Buendel wirklich starten
        shell: pwsh
        run: |
          $exe = "dist\Notizmappe\Notizmappe.exe"
          $uhr = [Diagnostics.Stopwatch]::StartNew()
          $p = Start-Process -FilePath $exe -ArgumentList "--pruefen" -PassThru -NoNewWindow `
                 -RedirectStandardOutput out.txt -RedirectStandardError err.txt -Wait
          Write-Host "Bis zur Antwort: $([math]::Round($uhr.Elapsed.TotalSeconds, 1)) s, Rueckgabe $($p.ExitCode)"
          Write-Host "--- Ausgabe ---"; if (Test-Path out.txt) { Get-Content out.txt }
          Write-Host "--- Fehler ---";  if (Test-Path err.txt) { Get-Content err.txt }
          if ($p.ExitCode -ne 0) { throw "Notizmappe.exe --pruefen endete mit $($p.ExitCode)" }
          $text = Get-Content out.txt -Raw
          if ($text -notmatch "Oberfläche:.*da") { throw "Die Oberflaeche wurde nicht gefunden" }
          if ($text -notmatch "Daten:") { throw "Die Daten liessen sich nicht lesen" }

      # Die Gegenprobe zu "kein Server": waehrend das Programm laeuft, darf es
      # keinen einzigen offenen Port geben. Frueher lauschte es auf 127.0.0.1.
      - name: Nachsehen, dass nichts lauscht
        shell: pwsh
        run: |
          $env:NOTIZMAPPE_OHNE_FENSTER = "1"
          $p = Start-Process -FilePath dist\Notizmappe\Notizmappe.exe -PassThru -NoNewWindow `
                 -RedirectStandardOutput lauf.txt -RedirectStandardError lauf-err.txt
          Start-Sleep -Seconds 8
          $lauscht = Get-NetTCPConnection -State Listen -OwningProcess $p.Id -ErrorAction SilentlyContinue
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          Write-Host "--- Ausgabe ---"; if (Test-Path lauf.txt) { Get-Content lauf.txt }
          if ($lauscht) {
            $lauscht | ForEach-Object { Write-Host "::error::lauscht auf $($_.LocalAddress):$($_.LocalPort)" }
            throw "Es wird gelauscht - ein Desktop-Programm soll keinen Port offen haben"
          }
          Write-Host "Kein offener Port."

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: Notizmappe-windows.zip

  release:
    needs: [linux, windows]
    # Nur bei einem Tag. So kann man den Bau per workflow_dispatch probieren, ohne
    # ein Release anzulegen und ohne eine Versionsnummer zu verbrennen.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: anhaenge
      - name: Release anlegen und anhaengen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Notizmappe ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            anhaenge/linux/*
            anhaenge/windows/*

  # Die fertige setup.exe einmal wirklich benutzen: installieren, starten, abfragen,
  # deinstallieren. Der Vorlagen-Workflow prueft nur, dass die Installation
  # durchlaeuft - ob danach etwas laeuft, sagt das nicht. Unter Linux war genau das
  # der Unterschied zwischen "installiert" und "tut was".
  windows_probe:
    needs: doppelklick
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    steps:
      - name: Setup aus dem Release holen
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          Invoke-WebRequest -UseBasicParsing -OutFile setup.exe `
            "https://github.com/${{ github.repository }}/releases/download/$tag/notizmappe-setup.exe"
          Write-Host "geladen: $((Get-Item setup.exe).Length) Bytes"

      - name: Stumm installieren
        shell: pwsh
        run: |
          $p = Start-Process .\setup.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Setup endete mit $($p.ExitCode)" }
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter "Notizmappe.exe" | Select-Object -First 1
          if (-not $exe) { throw "Notizmappe.exe nach der Installation nicht gefunden" }
          Write-Host "installiert: $($exe.FullName)"
          "EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Installierte Fassung pruefen
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "$env:EXE" -ArgumentList "--pruefen" -PassThru -NoNewWindow `
                 -RedirectStandardOutput i.txt -RedirectStandardError i-err.txt -Wait
          Get-Content i.txt
          if ($p.ExitCode -ne 0) { throw "Die installierte Fassung meldet $($p.ExitCode)" }
          $erwartet = "${{ github.ref_name }}".TrimStart("v")
          $vdatei = Join-Path (Split-Path $env:EXE) "_internal\app\VERSION"
          $drin = (Get-Content $vdatei -Raw).Trim()
          Write-Host "installierte Version: $drin"
          if ($drin -ne $erwartet) { throw "Falsche Version installiert: $drin statt $erwartet" }

      # Der Fall aus dem echten Leben: es laeuft bereits eine Fassung, und man
      # installiert darueber. Daran ist das Setup frueher gescheitert.
      - name: Ueber eine laufende Fassung installieren
        shell: pwsh
        run: |
          $env:NOTIZMAPPE_OHNE_FENSTER = "1"
          $laeuft = Start-Process -FilePath "$env:EXE" -PassThru -NoNewWindow `
                      -RedirectStandardOutput lauf.txt -RedirectStandardError lauf-err.txt
          Start-Sleep -Seconds 6
          $p = Start-Process .\setup.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -PassThru -Wait
          Write-Host "Setup-Rueckgabe: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "Setup ueber eine laufende Fassung endete mit $($p.ExitCode)" }
          if (-not (Test-Path "$env:EXE")) { throw "Nach dem Ueberinstallieren fehlt die exe" }
          Get-Process -Name "Notizmappe" -ErrorAction SilentlyContinue | Stop-Process -Force
          Write-Host "Ueberinstallieren hat funktioniert."

      # Das Selbstupdate durchspielen - mit dem Code, der gerade gebaut wurde.
      # Dafuer wird die Versionsdatei heruntergesetzt, damit sich die neue Fassung
      # fuer veraltet haelt.
      - name: Selbstupdate durchspielen
        shell: pwsh
        run: |
          $ordner = Split-Path $env:EXE
          $vdatei = Join-Path $ordner "_internal\app\VERSION"
          $echt = (Get-Content $vdatei -Raw).Trim()
          Set-Content -Path $vdatei -Value "1.0.0" -NoNewline
          Write-Host "Versionsdatei von $echt auf 1.0.0 gesetzt"

          $p = Start-Process -FilePath "$env:EXE" -ArgumentList "--update" -PassThru -NoNewWindow `
                 -RedirectStandardOutput u.txt -RedirectStandardError u-err.txt -Wait
          Write-Host "--- Antwort ---"; Get-Content u.txt
          if (Test-Path u-err.txt) { Get-Content u-err.txt }
          if ($p.ExitCode -ne 0) { throw "Das Update liess sich nicht anstossen" }

          $fertig = $false
          foreach ($i in 1..40) {
            Start-Sleep -Seconds 3
            if ((Test-Path $vdatei) -and ((Get-Content $vdatei -Raw).Trim() -eq $echt)) { $fertig = $true; break }
          }
          Write-Host "--- Protokolle ---"
          foreach ($k in @("update.log", "update-lauf.log", "update-setup.log", "fenster.log")) {
            $d = Join-Path $env:LOCALAPPDATA "notizmappe\$k"
            if (Test-Path $d) { Write-Host "[$k]"; Get-Content $d }
          }
          Get-Process -Name Notizmappe -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $fertig) { throw "Nach dem Update steht dort immer noch nicht $echt" }
          Write-Host "Selbstupdate hat funktioniert."

      - name: Wieder deinstallieren
        if: always()
        shell: pwsh
        run: |
          $u = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter "unins000.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($u) {
            $r = Start-Process $u.FullName -ArgumentList "/VERYSILENT" -PassThru -Wait
            Write-Host "deinstalliert, Rückgabe $($r.ExitCode)"
          }

  # Macht aus installer.conf die drei Linux-Doppelklick-Dateien und setup.exe und
  # haengt sie an dasselbe Release.
  doppelklick:
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/installer.yml
    with:
      tag: ${{ github.ref_name }}
    permissions:
      contents: write
