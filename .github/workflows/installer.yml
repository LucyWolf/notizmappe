# Builds the installers on every published release and attaches them to it:
#   Linux: three double-click installers (.desktop) + install script
#   Windows: <APP_ID>-setup.exe (Inno Setup)
# Controlled by installer.conf. This file does not need to be changed.
name: Installer

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.0.1"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  GH_TOKEN: ${{ github.token }}

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build installers
        run: python3 template/generate.py linux "${{ github.repository }}" "$TAG"
      - name: Check
        run: |
          shopt -s nullglob
          for f in output/*.sh; do bash -n "$f"; done
          ls -l output
      - name: Attach to release
        run: |
          shopt -s nullglob
          files=(output/*.sh output/*.desktop)
          [ ${#files[@]} -eq 0 ] || gh release upload "$TAG" "${files[@]}" --clobber --repo "${{ github.repository }}"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build setup script
        shell: bash
        run: python template/generate.py windows "${{ github.repository }}" "$TAG"
      - name: Get program file from the release
        shell: bash
        run: |
          [ -f output/setup.iss ] || { echo "No Windows setup wanted"; exit 0; }
          file=$(tr -d '\r' < output/setup.iss | sed -n 's/^#define AppExe "\(.*\)"$/\1/p')
          mkdir -p output/program
          # If another workflow uploads the file later, wait up to 10 minutes
          for i in $(seq 1 40); do
            gh release download "$TAG" -p "$file" -D output/program --clobber --repo "${{ github.repository }}" && break
            echo "waiting for $file in the release …"; sleep 15
          done
          [ -f "output/program/$file" ] || { echo "$file is missing in release $TAG"; exit 1; }
      - name: Build setup
        shell: pwsh
        run: |
          if (-not (Test-Path output\setup.iss)) { exit 0 }
          choco install innosetup -y --no-progress
          iscc output\setup.iss
      - name: Test setup (silent install and uninstall)
        shell: pwsh
        run: |
          $setup = Get-ChildItem output\output\*-setup.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $setup) { exit 0 }
          $p = Start-Process $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Setup: exit code $($p.ExitCode)" }
          $uninst = Get-ChildItem "$env:LOCALAPPDATA\Programs\*\unins000.exe" | Select-Object -First 1
          if (-not $uninst) { throw "Setup did not install anything" }
          $u = Start-Process $uninst.FullName -ArgumentList "/VERYSILENT" -PassThru -Wait
          if ($u.ExitCode -ne 0) { throw "Uninstall: exit code $($u.ExitCode)" }
      - name: Attach to release
        shell: bash
        run: |
          shopt -s nullglob
          files=(output/output/*-setup.exe)
          [ ${#files[@]} -eq 0 ] || gh release upload "$TAG" "${files[@]}" --clobber --repo "${{ github.repository }}"
