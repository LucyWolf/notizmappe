# Notizmappe-Server fuer ein Team.
#   docker compose up -d
#   docker logs notizmappe       -> dort steht der Einrichtungscode
#   http://<rechner>:8099        -> erstes Konto anlegen
# Fuers Internet gehoert ein Reverse-Proxy mit HTTPS davor (siehe README).
services:
  notizmappe:
    image: ghcr.io/lucywolf/notizmappe:latest
    build: .
    container_name: notizmappe
    restart: unless-stopped
    ports:
      - "8099:8099"
    volumes:
      - notizen:/notizen     # die Notizen (Notizbuecher = Projekte)
      - konfig:/konfig       # Konten und Sitzungen
    # Den Einrichtungscode selbst festlegen statt aus dem Protokoll zu lesen:
    # environment:
    #   NOTIZMAPPE_EINRICHTUNGSCODE: "ein-langer-geheimer-code"

volumes:
  notizen:
  konfig:
